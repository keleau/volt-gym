  <style>
    body { margin: 0; background: #111; color: #eee; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }

    h2 { font-size: 17px; font-weight: 600; margin: 32px 0 10px; scroll-margin-top: 20px; }

<body>
  <main>
    <h1>VOLT 健身 · 完整演示视频</h1>
    <p>三条流程均为 H.264/AAC。GitHub Pages 在线播放；Gitee 可下载原文件。</p>

    <h2 id="visitor">游客流程</h2>
    <p>游客预约体验课 → 登记会员卡 → 到店核销 → 查看训练记录。</p>
    <video controls preload="metadata" src="videos/visitor-flow.mp4"></video>

    <h2 id="card">开卡流程</h2>
    <p>官网登记 10 次卡 → 小程序绑定手机号 → 会员卡入账 → 到店核销。</p>
    <video controls preload="metadata" src="videos/card-open-flow.mp4"></video>

    <h2 id="booking">预约课流程</h2>
    <p>官网预约体验课 → 小程序登录绑定 → 到店扫码核销 → 查看训练档案。</p>
    <video controls preload="metadata" src="videos/booking-flow.mp4"></video>

    <p>

    </p>
  </main>
