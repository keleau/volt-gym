server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # 本地私有配置（GYM_DB_PASSWORD 等）放在同目录 .env，不进版本库
  config:
    import: "optional:file:.env[.properties]"
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: jdbc:mysql://${GYM_DB_HOST:localhost}:${GYM_DB_PORT:3306}/${GYM_DB_NAME:gym_management_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${GYM_DB_USER:root}
    password: ${GYM_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.gym.gymmanagementsystem.pojo
  configuration:
    map-underscore-to-camel-case: true

volt:
  auth:
    # 短信通道未接入：本地联调打开后 /auth/otp/send 会在响应里带回 devCode
    expose-otp: ${VOLT_EXPOSE_OTP:false}
  wx:
    # 配置后走真实 jscode2session；未配置时默认拒绝登录。
    # 本地演示或离线答辩可在 .env 设置 WX_DEMO_FALLBACK=true 落到种子会员。
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}
    demo-fallback: ${WX_DEMO_FALLBACK:false}
  staff:
    # 官网 /staff 店员开卡页使用；为空时店员接口关闭。
    key: ${VOLT_STAFF_KEY:}
  demo:
    # 小程序「演示支付并开卡」开关；只改业务状态，不调用微信支付，生产必须 false。
    pay-enabled: ${VOLT_DEMO_PAY:false}
  cors:
    allowed-origin-patterns: ${VOLT_CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
